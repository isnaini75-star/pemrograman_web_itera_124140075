
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan Class Product</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eaf6ff;
      color: #263445;
      margin: 0;
      padding: 30px 15px;
    }

    .container {
      max-width: 750px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 12px #00000012;
    }

    h1 {
      text-align: center;
      color: #2563eb;
    }

    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 11px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #output {
      margin-top: 20px;
      padding: 15px;
      background: #f0f7ff;
      border-radius: 10px;
      white-space: pre-wrap;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .info {
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Manajemen Produk</h1>
    <p class="info">
      Latihan JavaScript: Class, Inheritance, Getter/Setter,
      Computed Property Names, dan Destructuring
    </p>

    <button id="runButton">Jalankan Program</button>

    <div id="output">
      Klik tombol untuk menampilkan hasil.
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
