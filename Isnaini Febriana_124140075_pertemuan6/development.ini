[app:main]
use = egg:pyramid_mahasiswa

pyramid.reload_templates = true
pyramid.debug_all = true
pyramid.default_locale_name = id
sqlalchemy.url = postgresql+psycopg2://pyramid_user:pyramid_pass@localhost:5544/db_mahasiswa

[server:main]
use = egg:waitress
listen = 0.0.0.0:6543

[loggers]
keys = root, pyramid_mahasiswa, sqlalchemy.engine

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_pyramid_mahasiswa]
level = DEBUG
handlers =
qualname = pyramid_mahasiswa

[logger_sqlalchemy.engine]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s][%(threadName)s] %(message)s
