[app:main]
use = egg:pyramid_mahasiswa
pyramid.reload_templates = false
pyramid.debug_all = false
sqlalchemy.url = postgresql+psycopg2://pyramid_user:pyramid_pass@localhost:5544/db_mahasiswa

[server:main]
use = egg:waitress
listen = 0.0.0.0:6543

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
